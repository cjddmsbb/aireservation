<body class="font-sans text-sm antialiased">
  <div id="root"></div>
  <noscript>특별실 예약을 사용하려면 브라우저에서 자바스크립트를 허용해 주세요.</noscript>
  <script type="text/babel" data-type="module" data-presets="react">
    import {
      Layers, Calendar, ChevronRight, ChevronDown, Plus, X, Menu, Monitor,
      Music, Check, Clock, Lock, User, ArrowRight, Cloud, Info, Download,
      CheckCircle, AlertCircle, Loader2, RefreshCw, MapPin, Grid, Copy,
      Database, Settings, Edit, Trash2
    } from 'lucide-react';

    const {useState,useEffect,useRef}=React;
    const defaultRooms=[
      {id:'computer',name:'컴퓨터실',location:'본관 3층',capacity:30,description:'학생용 PC 30대 · 전자칠판'},
      {id:'science',name:'과학실',location:'본관 2층',capacity:28,description:'실험대 7개 · 실물화상기'},
      {id:'music',name:'음악실',location:'별관 2층',capacity:32,description:'디지털 피아노 · 음향 장비'},
      {id:'library',name:'도서실',location:'본관 1층',capacity:24,description:'모둠 테이블 · 수업용 화면'}
    ];
    const roomIcon=room=>({computer:Monitor,science:Grid,music:Music,library:Layers}[room?.id]||Grid);
    const periods=[
      ['09:00','09:45'],['09:55','10:40'],['10:50','11:35'],['11:45','12:30'],
      ['13:30','14:15'],['14:25','15:10'],['15:20','16:05'],['16:15','17:00']
    ];
    const dayNames=['월','화','수','목','금'];
    const storageKey='school-space-reservations-v1';
    const isHosted=!!window.google?.script?.run;
    const formatNumber=n=>new Intl.NumberFormat('ko-KR').format(n);
    const iso=value=>{
      const d=new Date(value);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const parseDate=value=>new Date(value+'T12:00:00');
    const addDays=(value,count)=>{const d=new Date(value);d.setDate(d.getDate()+count);return d;};
    const monday=value=>{
      const d=new Date(value);d.setHours(12,0,0,0);
      return addDays(d,-((d.getDay()+6)%7));
    };
    const fullDate=value=>new Intl.DateTimeFormat('ko-KR',{
      month:'long',day:'numeric',weekday:'long'
    }).format(typeof value==='string'?parseDate(value):value);
    const makeId=()=>window.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const inputClass='w-full rounded-lg border border-line bg-white px-3 py-2.5 text-sm text-ink placeholder:text-slate-400';
    const primaryClass='inline-flex items-center justify-center gap-2 rounded-lg bg-brand px-4 py-2.5 font-semibold text-white hover:bg-[#0d5c51] active:scale-[.98] transition-colors disabled:cursor-not-allowed disabled:opacity-60';
    const secondaryClass='inline-flex items-center justify-center gap-2 rounded-lg border border-line bg-white px-3.5 py-2.5 font-medium hover:bg-paper transition-colors disabled:cursor-not-allowed disabled:opacity-50';
    const emptyData=()=>({rooms:[],rules:[],bookings:[],updatedAt:null,revision:-1});

    function initialData(){
      const start=monday(new Date()),year=start.getFullYear();
      const rule=(id,roomId,days,startPeriod,endPeriod,purpose,teacher)=>({
        id,roomId,days,startPeriod,endPeriod,purpose,teacher,
        startDate:`${year}-01-01`,endDate:`${year}-12-31`
      });
      const booking=(id,day,period,purpose,teacher,className)=>({
        id,roomId:'computer',date:iso(addDays(start,day)),period,purpose,teacher,className
      });
      return {
        rooms:defaultRooms.map(r=>({...r})),
        rules:[
          rule('fixed-1','computer',[0],2,3,'5학년 정보 수업','김민준'),
          rule('fixed-2','computer',[2],3,4,'6학년 정보 수업','이서연'),
          rule('fixed-3','computer',[4],1,2,'4학년 정보 수업','박지훈'),
          rule('fixed-4','computer',[1],4,5,'디지털 기초 수업','정수빈'),
          rule('fixed-5','science',[1,3],2,3,'5학년 과학 수업','최유진'),
          rule('fixed-6','music',[0,2],4,4,'6학년 음악 수업','한지우'),
          rule('fixed-7','library',[4],3,4,'학년별 독서 수업','윤서진')
        ],
        bookings:[
          booking('booking-1',0,5,'자료 조사 및 발표 준비','이서연','6학년 2반'),
          booking('booking-2',1,2,'우리 동네 소개 자료 만들기','박지훈','4학년 1반'),
          booking('booking-3',2,6,'코딩 동아리','김민준','방과후 동아리'),
          booking('booking-4',3,3,'디지털 시민교육','최유진','5학년 3반'),
          booking('booking-5',3,4,'디지털 시민교육','최유진','5학년 3반'),
          booking('booking-6',4,7,'교내 연수 자료 제작','정수빈','교원 연수')
        ],
        updatedAt:null,revision:0
      };
    }
    function getSlot(data,roomId,date,period){
      const weekday=(parseDate(date).getDay()+6)%7;
      const fixed=data.rules.find(r=>r.roomId===roomId&&r.days.includes(weekday)&&
        date>=r.startDate&&date<=r.endDate&&period>=r.startPeriod&&period<=r.endPeriod);
      if(fixed)return {type:'fixed',entry:fixed};
      const booked=data.bookings.find(b=>b.roomId===roomId&&b.date===date&&b.period===period);
      return booked?{type:'booked',entry:booked}:{type:'free',entry:null};
    }
    function callServer(method,payload){
      return new Promise((resolve,reject)=>{
        if(!isHosted){reject(new Error('Apps Script로 배포한 주소에서만 공용 저장 기능을 사용할 수 있습니다.'));return;}
        const runner=window.google.script.run.withSuccessHandler(resolve)
          .withFailureHandler(error=>reject(new Error(error?.message||'서버 요청에 실패했습니다. 다시 확인해 주세요.')));
        switch(method){
          case 'getInitialState':runner.getInitialState();break;
          case 'createBooking':runner.createBooking(payload);break;
          case 'cancelBooking':runner.cancelBooking(payload);break;
          case 'createRule':runner.createRule(payload);break;
          case 'deleteRule':runner.deleteRule(payload);break;
          case 'createRoom':runner.createRoom(payload);break;
          case 'updateRoom':runner.updateRoom(payload);break;
          case 'deleteRoom':runner.deleteRoom(payload);break;
          default:reject(new Error('지원하지 않는 요청입니다.'));
        }
      });
    }

    const serverCode=String.raw`/**
 * 학교공간 · Apps Script 서버
 * 스프레드시트에 연결된 Code.gs 전체를 이 코드로 교체하세요.
 * HTML 파일 이름: index
 *
 * 교사 이메일 사전 등록 없이 사용합니다.
 * 배포 설정에서 허용된 사용자 중 접속자 이메일을 확인할 수 있는
 * 로그인 사용자는 모두 일반 교사 권한으로 이용합니다.
 * 관리자만 ADMIN_EMAILS 속성으로 구분합니다.
 *
 * 권장: 학교 Google Workspace 조직 내부로 웹 앱 접근 제한.
 * 링크는 비밀번호가 아니며, 교사 신분을 자동 판별하지 않습니다.
 */
var BOOKING_SHEET_='예약';
var RULE_SHEET_='고정시간표';
var ROOM_SHEET_='특별실';
var BOOKING_HEADERS_=[
  '예약번호','특별실','날짜','교시','사용목적',
  '예약자명','학급','예약자이메일','생성일시'
];
var RULE_HEADERS_=[
  '시간표번호','특별실','요일','시작교시','종료교시',
  '시작일','종료일','수업명','담당교사','등록자이메일','생성일시'
];
var ROOM_HEADERS_=['특별실번호','특별실명','위치','정원','시설안내'];

function doGet(){
  return HtmlService.createHtmlOutputFromFile('index')
    .setTitle('학교공간 · 특별실 예약')
    .addMetaTag('viewport','width=device-width, initial-scale=1');
}
function setupBookingSystem(){
  var book=SpreadsheetApp.getActiveSpreadsheet();
  if(!book)throw new Error('스프레드시트의 확장 프로그램에서 이 스크립트를 열어 주세요.');
  var email=String(Session.getEffectiveUser().getEmail()||'').toLowerCase().trim();
  if(!email)throw new Error('설치 계정 이메일을 확인하지 못했습니다.');
  return locked_(function(){
    var props=properties_();
    var savedId=props.getProperty('SPREADSHEET_ID');
    if(savedId&&savedId!==book.getId()){
      throw new Error('이미 다른 스프레드시트가 연결되어 있습니다. 스크립트 속성을 확인하세요.');
    }
    props.setProperty('SPREADSHEET_ID',book.getId());
    if(!props.getProperty('ADMIN_EMAILS'))props.setProperty('ADMIN_EMAILS',email);
    if(!props.getProperty('REVISION'))props.setProperty('REVISION','0');

    // 예전 교사 허용 목록은 더 이상 읽거나 사용하지 않습니다.
    // 기존 속성이 남아 있어도 접근 권한에 영향을 주지 않습니다.
    ensureSheet_(book,BOOKING_SHEET_,BOOKING_HEADERS_);
    ensureSheet_(book,RULE_SHEET_,RULE_HEADERS_);
    var initializeRooms=!book.getSheetByName(ROOM_SHEET_)||
      book.getSheetByName(ROOM_SHEET_).getLastRow()===0;
    ensureSheet_(book,ROOM_SHEET_,ROOM_HEADERS_);
    if(initializeRooms){
      var sheet=sheet_(book,ROOM_SHEET_,ROOM_HEADERS_);
      [
        ['computer','컴퓨터실','본관 3층','30','학생용 PC 30대 · 전자칠판'],
        ['science','과학실','본관 2층','28','실험대 7개 · 실물화상기'],
        ['music','음악실','별관 2층','32','디지털 피아노 · 음향 장비'],
        ['library','도서실','본관 1층','24','모둠 테이블 · 수업용 화면']
      ].forEach(function(row){appendTextRow_(sheet,row);});
    }
    book.setSpreadsheetTimeZone('Asia/Seoul');
    SpreadsheetApp.flush();
    changed_();
    console.log('설치 및 업데이트 완료. 기존 예약과 관리자 설정은 유지됩니다. 교사 이메일 사전 등록은 필요하지 않습니다.');
  });
}
function ensureSheet_(book,name,headers){
  var sheet=book.getSheetByName(name);
  if(!sheet)sheet=book.insertSheet(name);
  if(sheet.getLastRow()===0){
    sheet.getRange(1,1,1,headers.length).setValues([headers]);
    sheet.setFrozenRows(1);
    sheet.getRange(1,1,1,headers.length).setFontWeight('bold').setBackground('#edf5f0');
    sheet.autoResizeColumns(1,headers.length);
  }else verifyHeaders_(sheet,headers);
}
function verifyHeaders_(sheet,headers){
  var actual=sheet.getRange(1,1,1,headers.length).getDisplayValues()[0];
  if(actual.join('|')!==headers.join('|')){
    throw new Error('시트 머리글이 변경되었습니다: '+sheet.getName());
  }
}
function properties_(){return PropertiesService.getScriptProperties();}
function emailList_(value){
  return String(value||'').toLowerCase().split(/[,;\s]+/)
    .map(function(s){return s.trim();}).filter(Boolean);
}
function currentUser_(){
  // 접속자 본인의 이메일만 사용합니다.
  // 실행 소유자 이메일로 대체하면 모든 예약이 소유자 예약이 되므로 금지합니다.
  var email=String(Session.getActiveUser().getEmail()||'').toLowerCase().trim();
  if(!email){
    throw new Error('접속자 이메일을 확인하지 못했습니다. 학교 Google Workspace 계정으로 로그인하고 배포 접근 권한을 확인하세요. 본인 예약 취소 권한을 보호하기 위해 익명 사용은 허용하지 않습니다.');
  }
  var admin=emailList_(properties_().getProperty('ADMIN_EMAILS')).indexOf(email)>=0;
  // 교사 이메일 허용 목록 검사를 제거했습니다.
  // 실제 접근 범위는 Google 웹 앱 배포 설정으로 제한하세요.
  return {email:email,isAdmin:admin};
}
function admin_(){
  var user=currentUser_();
  if(!user.isAdmin)throw new Error('관리자만 사용할 수 있는 기능입니다.');
  return user;
}
function book_(){
  var id=properties_().getProperty('SPREADSHEET_ID');
  if(!id)throw new Error('먼저 setupBookingSystem을 실행해 주세요.');
  return SpreadsheetApp.openById(id);
}
function sheet_(book,name,headers){
  var sheet=book.getSheetByName(name);
  if(!sheet)throw new Error('필요한 시트가 없습니다: '+name+'. 담당자가 setupBookingSystem을 다시 실행해 주세요.');
  verifyHeaders_(sheet,headers);
  return sheet;
}
function rows_(sheet,width){
  var count=sheet.getLastRow()-1;
  return count>0?sheet.getRange(2,1,count,width).getDisplayValues():[];
}
function locked_(callback){
  var lock=LockService.getScriptLock();
  if(!lock.tryLock(25000))throw new Error('요청이 몰리고 있습니다. 잠시 후 다시 시도하세요.');
  try{return callback();}finally{lock.releaseLock();}
}
function readRooms_(book){
  return rows_(sheet_(book,ROOM_SHEET_,ROOM_HEADERS_),ROOM_HEADERS_.length)
    .filter(function(r){return r[0];}).map(function(r){
      return {id:r[0],name:untext_(r[1]),location:untext_(r[2]),
        capacity:Number(r[3]),description:untext_(r[4])};
    });
}
function readData_(book){
  var bookingRows=rows_(sheet_(book,BOOKING_SHEET_,BOOKING_HEADERS_),BOOKING_HEADERS_.length);
  var ruleRows=rows_(sheet_(book,RULE_SHEET_,RULE_HEADERS_),RULE_HEADERS_.length);
  return {
    rooms:readRooms_(book),
    bookings:bookingRows.filter(function(r){return r[0];}).map(function(r){
      return {
        id:r[0],roomId:r[1],date:r[2],period:Number(r[3]),purpose:untext_(r[4]),
        teacher:untext_(r[5]),className:untext_(r[6]),teacherEmail:r[7],createdAt:r[8]
      };
    }),
    rules:ruleRows.filter(function(r){return r[0];}).map(function(r){
      return {
        id:r[0],roomId:r[1],
        days:r[2].split(',').filter(function(v){return v!=='';}).map(Number),
        startPeriod:Number(r[3]),endPeriod:Number(r[4]),startDate:r[5],endDate:r[6],
        purpose:untext_(r[7]),teacher:untext_(r[8]),teacherEmail:r[9],createdAt:r[10]
      };
    }),
    revision:Number(properties_().getProperty('REVISION')||0),
    updatedAt:properties_().getProperty('UPDATED_AT')||null
  };
}
function response_(book,user){return {user:user,data:readData_(book)};}
function changed_(){
  var props=properties_();
  props.setProperty('REVISION',String(Number(props.getProperty('REVISION')||0)+1));
  props.setProperty('UPDATED_AT',new Date().toISOString());
}
function getInitialState(){
  var user=currentUser_();
  return locked_(function(){return response_(book_(),user);});
}
function textValue_(value,label,max,optional){
  if(typeof value!=='string'){
    if(optional&&(value===undefined||value===null))return '';
    throw new Error(label+'을(를) 확인하세요.');
  }
  var result=value.trim();
  if((!optional&&!result)||result.length>max||
      /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(result)){
    throw new Error(label+' 입력 길이 또는 내용을 확인하세요.');
  }
  return result;
}
function text_(value){
  var result=String(value==null?'':value);
  return /^[=+\-@']/.test(result)?'\u200B'+result:result;
}
function untext_(value){return String(value||'').replace(/^\u200B/,'');}
function appendTextRow_(sheet,row){
  var target=sheet.getRange(sheet.getLastRow()+1,1,1,row.length);
  target.setNumberFormat('@');
  target.setValues([row.map(text_)]);
}
function requireRoom_(rooms,id){
  if(!rooms.some(function(r){return r.id===id;})){
    throw new Error('존재하지 않거나 삭제된 특별실입니다. 화면을 갱신해 주세요.');
  }
}
function roomInput_(input){
  if(!input||typeof input!=='object')throw new Error('특별실 정보를 확인하세요.');
  var capacity=input.capacity;
  if(typeof capacity!=='number'||!Number.isInteger(capacity)||capacity<1||capacity>1000){
    throw new Error('정원은 1~1,000 사이의 정수로 입력하세요.');
  }
  return {
    name:textValue_(input.name,'특별실 이름',40,false),
    location:textValue_(input.location,'위치',60,true),
    capacity:capacity,
    description:textValue_(input.description,'시설 안내',160,true)
  };
}
function uniqueRoomName_(rooms,name,excludeId){
  var normalized=name.normalize('NFKC').toLowerCase();
  if(rooms.some(function(r){
    return r.id!==excludeId&&r.name.normalize('NFKC').toLowerCase()===normalized;
  }))throw new Error('같은 이름의 특별실이 있습니다. 다른 이름을 입력하세요.');
}
function createRoom(input){
  var user=admin_(),room=roomInput_(input);
  return locked_(function(){
    var book=book_();
    uniqueRoomName_(readRooms_(book),room.name,null);
    appendTextRow_(sheet_(book,ROOM_SHEET_,ROOM_HEADERS_),[
      Utilities.getUuid(),room.name,room.location,String(room.capacity),room.description

        const focusable=()=>[...panel.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(el=>el.offsetParent!==null);
        (panel.querySelector('input:not([type="checkbox"]),select')||focusable()[0]||panel).focus();

            const items=focusable(),first=items[0],last=items[items.length-1];
            if(!items.length){e.preventDefault();panel.focus();}

        if(!startDate||!endDate||endDate<startDate)next['rule-start']='종료일이 시작일 이후인 적용 기간을 선택해 주세요.';
        else if((parseDate(endDate)-parseDate(startDate))/86400000>366)next['rule-start']='한 번에 등록할 수 있는 기간은 최대 1년입니다.';
        setErrors(next);
        if(Object.keys(next).length){document.getElementById(Object.keys(next)[0]==='days'?'weekday-0':Object.keys(next)[0])?.focus();return;}
        setSaving(true);

          {errors.submit&&<p role="alert" className="text-sm leading-relaxed text-red-700">{errors.submit}</p>}
          <div className="flex justify-end gap-2 border-t border-line pt-4">
            <button type="button" disabled={saving} className={secondaryClass} onClick={onClose}>닫기</button>

    function downloadFile(contents,filename,type='text/plain;charset=utf-8'){
      const url=URL.createObjectURL(new Blob([contents],{type}));
      const link=document.createElement('a');
      link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }

      </div>;

            </div>
            <p className="mt-3 text-xs leading-6 text-[#476052]">배포 설정에서 접근이 허용되고 접속자 이메일을 확인할 수 있으면 별도 가입이나 교사 이메일 등록 없이 사용할 수 있습니다.</p>
          </div>
          <GuideNote warning>
            <strong>기존 운영 중인 앱은 서버와 화면을 모두 바꿔 주세요.</strong>
            <p>① Code.gs 전체 교체 → ② index HTML 전체 교체 → ③ setupBookingSystem 다시 실행 → ④ 배포 관리에서 기존 배포를 새 버전으로 업데이트합니다. 기존 예약·특별실·관리자 설정은 유지됩니다. 기존 TEACHER_EMAILS 속성은 삭제해도 되고 남겨 두어도 무시됩니다.</p>
          </GuideNote>
          <GuideNote>
            <strong>‘이메일 사전 등록 없음’은 ‘로그인 없음’과 다릅니다.</strong>
            <p>본인 예약만 취소할 수 있도록 Google 로그인은 유지합니다. 링크 자체는 비밀 인증 수단이 아닙니다. 이 안내창이 자동으로 설치하거나 배포하지는 않습니다.</p>
          </GuideNote>
          <div>
            <div className="mb-2 flex justify-between text-xs"><span className="font-semibold">진행 순서</span><span className="text-slate-500">직접 확인 {done.filter(Boolean).length} / 5단계</span></div>
            <div className="mb-4 flex gap-1.5" aria-hidden="true">{done.map((v,i)=><div key={i} className={`h-1.5 flex-1 rounded-full ${v?'bg-brand':'bg-paper'}`}/>)}</div>
            <nav className="grid gap-2" aria-label="설치 안내 단계">
              {titles.map(([title,description],i)=><button type="button" key={title} onClick={()=>selectStep(i)} aria-current={step===i?'step':undefined} className={`flex w-full items-center gap-3 rounded-lg border p-3 text-left ${step===i?'border-brand bg-emerald-50/60':'border-line hover:bg-paper'}`}>
                <span className={`flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-bold ${done[i]||step===i?'bg-brand text-white':'bg-paper text-slate-500'}`}>{done[i]?<Check size={14} aria-hidden="true"/>:i+1}</span>
                <span className="min-w-0 flex-1"><span className={`block text-sm font-semibold ${step===i?'text-brand':''}`}>{title}</span><span className="mt-0.5 block text-[11px] text-slate-500">{description}</span></span><ChevronRight size={15} className="shrink-0 text-slate-400" aria-hidden="true"/>
              </button>)}
            </nav>
          </div>
          <section className="rounded-xl border border-line p-4 sm:p-5" aria-labelledby="guide-step-title">
            <div className="mb-5 border-b border-line pb-4"><p className="mb-1 text-xs font-semibold">{step+1}단계</p><h3 id="guide-step-title" ref={headingRef} tabIndex="-1" className="text-lg font-bold tracking-tight">{titles[step][0]}</h3></div>
            <div className="space-y-4 text-sm">
              {step===0&&<>
                <p className="leading-7 text-slate-600">선생님별 이메일 허용 목록을 없앴습니다. 학교 Google Workspace 계정으로 로그인하고 공유 링크에 접속하는 방식을 권장합니다.</p>
                <GuideList>
                  <li>담당자와 이용 교사가 <strong className="text-ink">같은 학교 Google Workspace 조직 계정</strong>을 사용하는지 확인하세요.</li>
                  <li>웹 앱의 접근 범위는 <strong className="text-ink">가능하면 학교 조직 내부</strong>로 제한하세요. 서버는 더 이상 교사 이메일을 하나씩 검사하지 않습니다.</li>
                  <li>학교에서 Apps Script 웹 앱과 외부 CDN을 허용하는지, 개인정보 보관 기준에 맞는지 확인하세요.</li>
                  <li>교사는 <strong className="text-ink">웹 앱 주소만</strong> 이용합니다. 원본 스프레드시트와 Apps Script 편집 권한은 담당자만 갖도록 유지하세요.</li>
                </GuideList>
                <GuideNote warning>

                </GuideNote>
                <GuideNote>실행 시간·동시 실행·일일 사용량 제한이 있습니다. 화면은 약 20초마다 갱신하며, 대규모 운영이나 엄격한 감사·복구가 필요하면 전용 데이터베이스를 검토하세요. 학생 이름이나 민감한 정보는 입력하지 마세요.</GuideNote>
              </>}
              {step===1&&<>
                <GuideList>
                  <li>학교 계정으로 <strong className="text-ink">‘학교공간 예약 장부’</strong> 스프레드시트를 만드세요. 기존 설치는 기존 장부를 그대로 사용합니다.</li>
                  <li><strong className="text-ink">확장 프로그램 → Apps Script</strong>를 누르세요.</li>
                  <li><code>Code.gs</code>의 기존 내용을 모두 지우고 아래 <strong className="text-ink">수정된 서버 코드 전체</strong>를 붙여 넣으세요.</li>

              </>}
              {step===2&&<>
                <GuideList>
                  <li>Apps Script 파일 영역에서 <strong className="text-ink">추가 → HTML</strong>을 누르고 소문자 <code>index</code>로 만드세요. 기존 설치는 기존 파일을 엽니다.</li>
                  <li>기존 내용을 지우고 <strong className="text-ink">이번 답변의 전체 HTML</strong>을 처음부터 끝까지 붙여 넣고 저장하세요.</li>

                  ].map(([name,text])=><div key={name}><dt className="break-all font-mono font-semibold">{name}</dt><dd className="text-slate-500">{text}</dd></div>)}</dl>
                </div>

                <p className="text-xs leading-6 text-slate-500">HTML에는 비밀번호나 비밀 키를 넣지 않습니다. 원본 장부의 편집 공유 범위는 넓히지 마세요.</p>
              </>}
              {step===3&&<>
                <GuideList>
                  <li>신규 설치는 <strong className="text-ink">배포 → 새 배포 → 웹 앱</strong>을 선택하세요. 기존 설치는 <strong className="text-ink">배포 관리</strong>에서 기존 배포를 편집하세요.</li>
                  <li><strong className="text-ink">실행 사용자</strong>는 배포 소유자인 ‘나’로 지정합니다. 서버가 소유자 권한으로 장부에 기록합니다.</li>
                  <li><strong className="text-ink">액세스 권한</strong>은 가능하면 <strong className="text-ink">학교 조직 내부 사용자</strong>로 제한하세요. 표시되는 선택지는 학교 정책과 계정에 따라 다릅니다.</li>
                  <li>기존 배포는 <strong className="text-ink">새 버전</strong>을 선택해 배포하세요. 저장만 하면 운영 주소에는 반영되지 않습니다.</li>
                  <li>끝이 <code>/exec</code>인 주소를 선생님들에게 공유하세요. 학교 계정으로 로그인하면 교사 이메일 사전 등록 없이 이용합니다.</li>

              </>}
              {step===4&&<>
                <p className="leading-7 text-slate-600">관리자와 이메일을 사전 등록하지 않은 일반 교사 계정으로 확인한 뒤 주소를 공유하세요.</p>
                <ul className="space-y-3">{[
                  ['사전 등록 없는 이용','TEACHER_EMAILS에 없는 학교 계정으로 조회와 예약이 되는지 확인합니다.'],
                  ['공용 저장','다른 기기에서 갱신하거나 약 20초 기다리면 변경 사항이 보여야 합니다.'],
                  ['특별실 관리','관리자만 공간을 추가·수정·삭제할 수 있고, 이름 변경 후 기존 일정이 유지되어야 합니다.'],
                  ['안전한 삭제','일정이 있는 공간과 마지막 공간은 삭제되지 않아야 합니다.'],
                  ['동시 예약 방지','두 계정이 같은 시간을 예약하면 한 건만 저장되어야 합니다.'],

                  ['접근 범위 확인','배포에서 제한한 조직 외 계정이 차단되는지 확인합니다. 링크 유출에 대비해 공유 범위도 점검합니다.'],
                  ['본인 확인 실패 차단','이메일을 확인하지 못하면 접근을 차단하고 브라우저 저장으로 몰래 전환하지 않아야 합니다.']

              </>}
            </div>
            <label className="mt-6 flex cursor-pointer items-start gap-2.5 border-t border-line pt-4 text-xs leading-6 text-slate-600">
              <input type="checkbox" checked={done[step]} onChange={()=>setDone(prev=>prev.map((v,i)=>i===step?!v:v))} className="mt-1 h-4 w-4 shrink-0 accent-[#147366]"/>
              <span>이 단계의 실제 작업과 확인을 마쳤습니다.<span className="block text-[11px] text-slate-500">개인 확인용이며 실제 연결을 검사하지 않습니다. 창을 닫으면 초기화됩니다.</span></span>

            <div className="mt-4 flex justify-between gap-3">

          <div className="rounded-lg border border-line">

            {showTerms&&<dl id="guide-terms" className="space-y-3 border-t border-line p-4 text-xs leading-6">{[

              ['스크립트 속성','연결 장부와 관리자 계정을 서버에 보관하는 설정입니다. 교사 이메일 목록은 필요하지 않습니다.'],

    function App(){
      const [data,setData]=useState(()=>isHosted?emptyData():initialData()),dataRef=useRef(data);
      dataRef.current=data;
      const [user,setUser]=useState(null),[loading,setLoading]=useState(true),[refreshing,setRefreshing]=useState(false);
      const [storageError,setStorageError]=useState(''),[serverError,setServerError]=useState(''),[lastSync,setLastSync]=useState(null);
      const [roomId,setRoomId]=useState('computer'),[week,setWeek]=useState(()=>monday(new Date()));
      const [selectedDay,setSelectedDay]=useState(()=>Math.min((new Date().getDay()+6)%7,4));
      const [view,setView]=useState('week'),[filter,setFilter]=useState('all'),[drawer,setDrawer]=useState(false);
      const [modal,setModal]=useState(null),[toast,setToast]=useState('');
      const toastTimer=useRef(null),fetching=useRef(false),active=useRef(true);

      const rooms=data.rooms,room=rooms.find(r=>r.id===roomId)||rooms[0]||null;
      const currentRoomId=room?.id||'',RoomIcon=roomIcon(room);
      const dates=Array.from({length:5},(_,i)=>iso(addDays(week,i))),today=iso(new Date());
      const canManage=!isHosted||!!user?.isAdmin;
      const available=!loading&&(!isHosted||(!!user&&!serverError));
      useEffect(()=>{if(room&&room.id!==roomId)setRoomId(room.id);},[room?.id,roomId]);

      function acceptResponse(result){
        if(!result?.data||!result.user?.email||!Array.isArray(result.data.rooms)||!Array.isArray(result.data.bookings)||!Array.isArray(result.data.rules)){
          throw new Error('서버 응답 형식이 올바르지 않습니다. 최신 서버 코드로 교체하고 setupBookingSystem을 다시 실행한 뒤 새 버전으로 배포해 주세요.');
        }
        if(!active.current)return;
        if(Number(result.data.revision)>=Number(dataRef.current.revision??-1)){
          dataRef.current=result.data;setData(result.data);setUser(result.user);
        }
        setServerError('');setLastSync(new Date());
      }
      async function refresh(){
        if(!isHosted||fetching.current)return;
        fetching.current=true;if(active.current)setRefreshing(true);
        try{acceptResponse(await callServer('getInitialState'));}
        catch(error){
          if(active.current){setServerError(error.message);dataRef.current=emptyData();setData(emptyData());setUser(null);}
        }finally{
          fetching.current=false;
          if(active.current){setRefreshing(false);setLoading(false);}
        }
      }
      useEffect(()=>{
        active.current=true;
        let interval;
        if(isHosted){refresh();interval=setInterval(()=>{if(!document.hidden)refresh();},20000);}
        else{
          try{
            const raw=localStorage.getItem(storageKey);
            if(raw){
              const saved=JSON.parse(raw);
              if(!Array.isArray(saved.bookings)||!Array.isArray(saved.rules))throw new Error();
              if(!Array.isArray(saved.rooms))saved.rooms=defaultRooms.map(r=>({...r}));
              const ids=new Set(saved.rooms.map(r=>r.id));
              const validRooms=saved.rooms.length>0&&ids.size===saved.rooms.length&&saved.rooms.every(r=>
                typeof r.id==='string'&&typeof r.name==='string'&&r.name.trim()&&Number.isInteger(r.capacity)&&r.capacity>=1&&r.capacity<=1000);
              const validRules=saved.rules.every(r=>ids.has(r.roomId)&&Array.isArray(r.days)&&r.days.every(d=>Number.isInteger(d)&&d>=0&&d<=4)&&
                Number.isInteger(r.startPeriod)&&r.startPeriod>=1&&Number.isInteger(r.endPeriod)&&r.endPeriod<=8&&r.endPeriod>=r.startPeriod&&
                /^\d{4}-\d{2}-\d{2}$/.test(r.startDate)&&/^\d{4}-\d{2}-\d{2}$/.test(r.endDate)&&typeof r.teacher==='string'&&typeof r.purpose==='string');
              const validBookings=saved.bookings.every(b=>ids.has(b.roomId)&&/^\d{4}-\d{2}-\d{2}$/.test(b.date)&&Number.isInteger(b.period)&&b.period>=1&&b.period<=8&&typeof b.teacher==='string'&&typeof b.purpose==='string');
              if(!validRooms||!validRules||!validBookings)throw new Error();
              saved.revision=saved.revision||0;dataRef.current=saved;setData(saved);
            }
          }catch{setStorageError('저장 자료를 불러오지 못해 예시 시간표를 표시합니다. 브라우저 저장 권한을 확인해 주세요.');}
          setLoading(false);
        }
        return ()=>{active.current=false;clearInterval(interval);clearTimeout(toastTimer.current);};
      },[]);
      useEffect(()=>{
        if(!drawer)return;
        const old=document.body.style.overflow,previous=document.activeElement;
        document.body.style.overflow='hidden';
        const focusable=()=>[...drawerRef.current.querySelectorAll('a[href],button:not([disabled])')].filter(el=>el.offsetParent!==null);
        focusable()[0]?.focus();
        const handler=e=>{
          if(e.key==='Escape')setDrawer(false);
          if(e.key==='Tab'){
            const list=focusable(),first=list[0],last=list[list.length-1];
            if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
            else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
          }
        };
        window.addEventListener('keydown',handler);
        return ()=>{document.body.style.overflow=old;window.removeEventListener('keydown',handler);if(previous?.isConnected)previous.focus();};
      },[drawer]);
      function notify(message){
        setToast(message);clearTimeout(toastTimer.current);
        toastTimer.current=setTimeout(()=>setToast(''),4500);
      }
      function commit(next){
        const updated={...next,updatedAt:new Date().toISOString(),revision:Number(next.revision||0)+1};
        dataRef.current=updated;setData(updated);
        try{localStorage.setItem(storageKey,JSON.stringify(updated));setStorageError('');return true;}
        catch{setStorageError('브라우저에 저장하지 못했습니다. 현재 변경은 임시 상태이며 새로고침하면 사라집니다. 자료를 내보내 보관해 주세요.');return false;}
      }
      async function mutate(method,payload){
        try{acceptResponse(await callServer(method,payload));return null;}
        catch(error){return `${error.message} 통신 오류라면 갱신하여 실제 저장 결과를 먼저 확인해 주세요.`;}

      function hasRoom(id){return dataRef.current.rooms.some(r=>r.id===id);}

        if(isHosted){
          if(!available)return '연결 상태를 먼저 확인해 주세요.';
          const error=await mutate('createBooking',booking);if(error)return error;
          if(active.current){setModal(null);notify('공용 장부에 예약을 등록했습니다.');}return null;
        }
        const current=dataRef.current;
        if(!hasRoom(booking.roomId))return '삭제된 특별실입니다. 다른 특별실을 선택해 주세요.';
        if(getSlot(current,booking.roomId,booking.date,booking.period).type!=='free')return '이 시간에 다른 일정이 있습니다. 다른 시간을 선택해 주세요.';
        const saved=commit({...current,bookings:[...current.bookings,booking]});
        setModal(null);notify(saved?'이 브라우저에 예약을 등록했습니다.':'임시로 반영했습니다. 브라우저 저장에 실패했습니다.');return null;
      }
      async function saveRule(rule){
        if(isHosted){
          if(!available||!canManage)return '관리자 권한과 연결 상태를 확인해 주세요.';
          const error=await mutate('createRule',rule);if(error)return error;
          if(active.current){setModal(null);notify('공용 장부에 고정 시간표를 등록했습니다.');}return null;
        }
        const current=dataRef.current;
        if(!hasRoom(rule.roomId))return '존재하지 않는 특별실입니다.';
        let count=0,conflicts=0;
        for(let date=parseDate(rule.startDate);iso(date)<=rule.endDate;date=addDays(date,1)){
          if(!rule.days.includes((date.getDay()+6)%7))continue;
          for(let period=rule.startPeriod;period<=rule.endPeriod;period++){
            count++;if(getSlot(current,rule.roomId,iso(date),period).type!=='free')conflicts++;
          }
        }
        if(!count)return '선택한 기간에 해당하는 요일이 없습니다. 적용 기간이나 반복 요일을 변경해 주세요.';
        if(conflicts)return `기존 일정과 겹치는 시간이 ${formatNumber(conflicts)}교시 있습니다. 등록된 내용은 없습니다.`;
        const saved=commit({...current,rules:[...current.rules,rule]});
        setModal(null);notify(saved?`${formatNumber(count)}교시의 고정 수업을 일괄 등록했습니다.`:'임시로 반영했습니다. 브라우저 저장에 실패했습니다.');return null;

      }
      async function saveRoom(input,editing=false){
        if(!available||!canManage)return '관리자 권한과 연결 상태를 확인해 주세요.';
        if(isHosted)return await mutate(editing?'updateRoom':'createRoom',input);
        const current=dataRef.current;
        if(editing&&!hasRoom(input.id))return '이미 삭제된 특별실입니다.';
        if(current.rooms.some(r=>r.id!==(editing?input.id:null)&&r.name.normalize('NFKC').toLowerCase()===input.name.normalize('NFKC').toLowerCase()))return '같은 이름의 특별실이 있습니다. 다른 이름을 입력해 주세요.';
        const nextRooms=editing?current.rooms.map(r=>r.id===input.id?{...r,...input}:r):[...current.rooms,{...input,id:makeId()}];
        if(!commit({...current,rooms:nextRooms}))notify('임시로 반영했습니다. 브라우저 저장에 실패했습니다.');return null;
      }

          <div className="flex items-center justify-center border-b border-r border-line bg-[#fafbf9] text-[11px] font-medium text-slate-500">교시</div>
          {shownDates.map(date=><div key={date} className={`flex h-[66px] items-center justify-center gap-2 border-b border-r border-line last:border-r-0 ${date===today?'bg-[#f1f8f4]':'bg-[#fafbf9]'}`}>
            <span className={`text-[13px] font-medium ${date===today?'text-brand':'text-slate-500'}`}>{dayNames[(parseDate(date).getDay()+6)%7]}</span>
            <span className={`flex h-8 w-8 items-center justify-center rounded-full text-base font-semibold tabular-nums ${date===today?'bg-brand text-white':'text-ink'}`}>{parseDate(date).getDate()}</span>
            {date===today&&<span className="hidden text-[10px] font-medium text-brand lg:inline">오늘</span>}
          </div>)}
          {periods.map((times,index)=><React.Fragment key={index}>
            {index===4&&<div className="col-span-full flex h-7 items-center justify-center gap-2 border-b border-line bg-[#fafbf9] text-[10px] tracking-wide text-slate-500"><Clock size={11} aria-hidden="true"/>점심시간 · 12:30 ~ 13:30</div>}
            <div className="flex flex-col items-center justify-center border-b border-r border-line bg-white"><span className="text-xs font-semibold">{index+1}교시</span><span className="mt-1.5 text-[10px] tabular-nums leading-relaxed text-slate-500">{times[0]}<br/>{times[1]}</span></div>
            {shownDates.map(date=><Cell key={`${date}-${index}`} date={date} period={index+1}/>)}
          </React.Fragment>)}
        </div>;
      }
      const bookingRoom=modal?.type==='booking'?rooms.find(r=>r.id===modal.roomId):null;
      return <div className="flex min-h-screen">
        <a href="#main" className="fixed left-4 top-3 z-[70] -translate-y-20 rounded-lg bg-brand px-4 py-2 text-white focus:translate-y-0">본문 바로가기</a>
        <aside className="sticky top-0 hidden h-screen w-[232px] shrink-0 overflow-y-auto border-r border-line bg-[#f1f4f2] scrollbar lg:block"><Sidebar/></aside>
        {drawer&&<div className="fixed inset-0 z-40 bg-[#142c25]/40 lg:hidden" onClick={()=>setDrawer(false)}>
          <aside ref={drawerRef} role="dialog" aria-modal="true" aria-label="모바일 메뉴" className="relative h-full w-[280px] max-w-[88vw] overflow-y-auto bg-[#f1f4f2]" onClick={e=>e.stopPropagation()}><Sidebar mobile/></aside>
        </div>}
        <div className="min-w-0 flex-1">
          <header className="flex h-[72px] items-center justify-between gap-3 border-b border-line bg-white px-4 sm:px-7 lg:px-9">
            <div className="flex min-w-0 items-center gap-3 text-xs">
              <button type="button" ref={menuButtonRef} className="rounded-lg p-1.5 hover:bg-paper lg:hidden" aria-label="메뉴 열기" aria-expanded={drawer} onClick={()=>setDrawer(true)}><Menu size={21} aria-hidden="true"/></button>
              <span className="hidden text-slate-500 sm:inline">공간 관리</span><ChevronRight size={13} className="hidden text-slate-400 sm:block" aria-hidden="true"/><span className="truncate font-medium">특별실 예약</span>
            </div>
            <div className="flex shrink-0 items-center gap-3 sm:gap-5">
              <button type="button" onClick={()=>open('deployment')} className="flex items-center gap-1.5 text-xs text-slate-500 hover:text-brand"><span className={`h-1.5 w-1.5 rounded-full ${isHosted?'bg-brand':'bg-amber-600'}`}/><span>{isHosted?'학교 공용 저장':'시연 모드'}</span><Info size={13} aria-hidden="true"/></button>
              <div className="h-5 border-l border-line"/>
              <div className="flex items-center gap-2.5"><span className="flex h-8 w-8 items-center justify-center rounded-full border border-line bg-paper text-slate-600"><User size={16} aria-hidden="true"/></span><span className="hidden text-xs font-medium sm:block">{isHosted?(user?(user.isAdmin?'관리자':'교사'):'계정 확인 중'):'교사 미리보기'}</span></div>
            </div>
          </header>
          <main id="main" tabIndex="-1" className="mx-auto max-w-[1480px] px-4 py-6 sm:px-7 lg:px-9 lg:py-8">
            <section className="mb-6 flex flex-wrap items-start justify-between gap-4">
              <div><div className="mb-2 flex items-center gap-2 text-xs font-medium text-brand"><span className="h-1.5 w-1.5 rounded-full bg-brand"/>공간이 연결되는 학교</div>
                <h1 className="text-[26px] font-bold tracking-tight sm:text-[28px]">특별실 예약</h1><p className="mt-2 text-sm leading-relaxed text-slate-500">필요한 공간을 확인하고, 수업에 맞는 시간을 예약하세요.</p></div>
              {canManage&&<div className="flex flex-wrap gap-2">
                <button type="button" onClick={()=>open('rooms')} disabled={!available} className={`${secondaryClass} text-xs shadow-soft`}><Settings size={15} aria-hidden="true"/>특별실 관리</button>
                <button type="button" onClick={()=>open('recurring')} disabled={!available||!room} className={`${secondaryClass} text-xs shadow-soft`}><RefreshCw size={15} aria-hidden="true"/>고정 시간표 관리</button>
              </div>}
            </section>
            <div className="mb-5 flex flex-wrap items-center justify-between gap-2 rounded-lg border border-[#dce7e0] bg-[#edf3ef] px-3.5 py-3 text-xs text-[#476052]">
              <p className="flex min-w-0 items-start gap-2 leading-relaxed">
                {isHosted?<Database size={15} className="mt-0.5 shrink-0" aria-hidden="true"/>:<Info size={15} className="mt-0.5 shrink-0" aria-hidden="true"/>}
                <span className="min-w-0">{isHosted?<>교사 이메일 사전 등록 없이 이용합니다. 변경 사항은 약 20초마다 확인합니다.{user&&<span className="mt-1 block break-all">로그인: {user.email}</span>}</>:'예시 시간표가 포함된 시연 화면입니다. 예약과 특별실 변경은 이 브라우저에만 저장되며 다른 사용자와 공유되지 않습니다.'}</span>
              </p>
              {isHosted?<button type="button" disabled={refreshing} onClick={refresh} className="ml-auto flex shrink-0 items-center gap-1.5 font-semibold text-brand disabled:opacity-50"><RefreshCw size={13} className={refreshing?'animate-spin':''} aria-hidden="true"/>{refreshing?'확인하는 중…':'지금 갱신'}</button>
                :<button type="button" onClick={()=>open('deployment')} className="ml-auto flex shrink-0 items-center gap-1 font-semibold text-brand hover:underline">공유 서비스로 운영하기<ArrowRight size={13} aria-hidden="true"/></button>}
            </div>
            {(storageError||serverError)&&<div role="alert" className="mb-5 flex gap-2 rounded-lg border border-red-200 bg-red-50 p-3 text-xs leading-6 text-red-800">
              <AlertCircle size={16} className="mt-1 shrink-0" aria-hidden="true"/><div className="min-w-0">
                <p className="break-words">{serverError||storageError}</p>
                {isHosted&&<p>공용 저장 연결에 실패했습니다. 브라우저 저장으로 전환하지 않습니다.</p>}
                <div className="mt-1 flex flex-wrap gap-3">
                  {isHosted&&<button type="button" disabled={refreshing} onClick={refresh} className="font-semibold underline">다시 연결</button>}
                  <button type="button" onClick={()=>open('deployment')} className="font-semibold underline">{isHosted?'설치 안내 확인':'자료 내보내기'}</button>
                </div>
              </div>
            </div>}
            <section className="overflow-hidden rounded-xl border border-line bg-white shadow-soft" aria-label="특별실 예약 캘린더">
              <div className="flex flex-wrap items-center justify-between gap-4 p-4 sm:px-5">
                <div className="flex min-w-0 flex-1 items-center gap-3">
                  <span className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#edf5f1] text-brand"><RoomIcon size={22} aria-hidden="true"/></span>
                  <div className="min-w-0"><h2 className="break-words text-lg font-bold tracking-tight">{room?.name||(loading?'특별실 불러오는 중…':'특별실 목록 확인')}</h2>
                    {room&&<p className="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] text-slate-500">
                      <span className="flex min-w-0 items-center gap-1"><MapPin size={11} className="shrink-0" aria-hidden="true"/><span className="break-words">{room.location||'위치 미등록'}</span></span><span>·</span><span>정원 {formatNumber(room.capacity)}명</span>
                      {room.description&&<span className="hidden break-words xl:inline">· {room.description}</span>}
                    </p>}
                  </div>
                </div>
                <select aria-label="특별실 선택" disabled={!rooms.length} className="max-w-full rounded-lg border border-line bg-white px-3 py-2 text-xs lg:hidden" value={currentRoomId} onChange={e=>{setRoomId(e.target.value);setFilter('all');}}>
                  {!rooms.length&&<option value="">특별실 없음</option>}{rooms.map(r=><option value={r.id} key={r.id}>{r.name}</option>)}
                </select>
                <div className="hidden items-center gap-2 rounded-md bg-paper px-2.5 py-1.5 text-[11px] text-slate-500 lg:flex"><Calendar size={13} aria-hidden="true"/>평일 1~8교시 운영</div>
              </div>
              <div className="mx-4 grid grid-cols-3 divide-x divide-line border-y border-line py-4 sm:mx-5">
                {[['예약 가능',stats.free,'text-brand','bg-brand'],['일반 예약',stats.booked,'text-ink','bg-[#6b9f86]'],['고정 수업',stats.fixed,'text-ink','bg-slate-400']].map(([label,count,color,dot])=>
                  <div key={label} className="px-3 first:pl-0 sm:px-6">
                    <p className="mb-1.5 flex items-center gap-1.5 text-[11px] text-slate-500"><span className={`h-1.5 w-1.5 rounded-full ${dot}`}/>{label}<span className="hidden text-[10px] text-slate-500 sm:inline">선택 주간</span></p>
                    <p className={`text-2xl font-semibold tabular-nums tracking-tight ${color}`}>{!available||!room?'—':formatNumber(count)}<span className="ml-1.5 text-[11px] font-normal text-slate-500">교시</span></p>
                  </div>)}
              </div>
              <div className="flex flex-wrap items-center justify-between gap-4 p-4 sm:px-5">
                <div className="flex flex-wrap items-center gap-3">
                  <h3 className="text-base font-semibold tracking-tight tabular-nums">
                    {new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long'}).format(week)}
                    <span className="ml-2 text-sm font-medium text-slate-500">{parseDate(dates[0]).getDate()}일 ~ {parseDate(dates[4]).getMonth()!==parseDate(dates[0]).getMonth()?`${parseDate(dates[4]).getMonth()+1}월 `:''}{parseDate(dates[4]).getDate()}일</span>
                  </h3>
                  <div className="flex items-center gap-1">
                    <button type="button" aria-label={view==='week'?'이전 주':'이전 평일'} onClick={()=>move(-1)} className="rounded-md border border-line p-1.5 hover:bg-paper"><ChevronRight size={14} className="rotate-180" aria-hidden="true"/></button>
                    <button type="button" aria-label={view==='week'?'다음 주':'다음 평일'} onClick={()=>move(1)} className="rounded-md border border-line p-1.5 hover:bg-paper"><ChevronRight size={14} aria-hidden="true"/></button>
                    <button type="button" onClick={goToday} className="ml-1 rounded-md border border-line px-2.5 py-1.5 text-[11px] font-medium hover:bg-paper">오늘</button>
                  </div>
                </div>
                <div className="hidden items-center rounded-lg bg-paper p-1 md:flex" aria-label="캘린더 보기 방식">
                  {[['week','주간'],['day','일간']].map(([value,label])=><button type="button" key={value} aria-pressed={view===value} onClick={()=>setView(value)} className={`rounded-md px-3 py-1.5 text-xs transition-colors ${view===value?'bg-white font-semibold text-ink shadow-soft':'text-slate-500 hover:text-ink'}`}>{label}</button>)}
                </div>
              </div>
              <div className={`px-4 pb-3 sm:px-5 ${view==='day'?'':'md:hidden'}`}><div className="grid grid-cols-5 gap-1 rounded-lg bg-paper p-1">
                {dates.map((date,i)=><button type="button" key={date} aria-pressed={selectedDay===i} onClick={()=>setSelectedDay(i)} className={`rounded-md py-2 text-xs ${selectedDay===i?'bg-white font-semibold text-brand shadow-soft':'text-slate-500 hover:bg-white'}`}>{dayNames[i]} <span className="ml-1 tabular-nums">{parseDate(date).getDate()}</span></button>)}
              </div></div>
              <div className="flex flex-wrap items-center justify-between gap-3 border-t border-line px-4 py-3 sm:px-5">
                <div className="flex flex-wrap items-center gap-3 sm:gap-4" aria-label="예약 상태 필터">
                  {[['all','전체'],['free','예약 가능'],['booked','일반 예약'],['fixed','고정 수업']].map(([value,label])=><button type="button" key={value} onClick={()=>setFilter(value)} aria-pressed={filter===value} className={`flex items-center gap-1.5 rounded px-0.5 py-1 text-[11px] ${filter===value?'font-semibold text-ink':'text-slate-500 hover:text-ink'}`}>
                    {value!=='all'&&<span className={`h-2 w-2 rounded-sm border ${value==='free'?'border-[#bbd2c5] bg-white':value==='booked'?'border-[#a4c9b7] bg-[#d8eddf]':'border-slate-300 bg-slate-200'}`}/>}
                    <span className={filter===value?'underline decoration-brand decoration-2 underline-offset-4':''}>{label}</span>
                  </button>)}
                </div>
                <p className="hidden items-center gap-1.5 text-[11px] text-slate-500 xl:flex"><Info size={12} aria-hidden="true"/>시간을 클릭하면 예약 가능 여부와 상세 정보를 볼 수 있어요.</p>
              </div>
              {!loading&&!room&&!serverError?<div className="border-t border-line px-5 py-14 text-center">
                <Grid size={30} className="mx-auto mb-3 text-slate-400" aria-hidden="true"/><p className="font-semibold">등록된 특별실이 없습니다</p>
                <p className="mt-2 text-xs text-slate-500">{canManage?'특별실을 추가하면 예약을 시작할 수 있습니다.':'관리자에게 특별실 등록을 요청해 주세요.'}</p>
                {canManage&&<button type="button" onClick={()=>open('rooms')} className={`${primaryClass} mt-4 text-xs`}><Plus size={15} aria-hidden="true"/>특별실 추가하기</button>}
              </div>:<div aria-busy={loading}>
                <div className={view==='week'?'hidden md:block':'hidden'}><CalendarTable/></div>
                <div className={view==='week'?'md:hidden':''}><CalendarTable single/></div>
              </div>}
              <div className="flex flex-wrap items-center justify-between gap-2 bg-[#fafbf9] px-4 py-3 text-[11px] text-slate-500 sm:px-5">
                <p className="flex items-center gap-1.5"><Lock size={12} aria-hidden="true"/>고정 수업 시간은 일반 예약이 불가능합니다.</p>
                <p className="tabular-nums">{isHosted?(lastSync?`최근 확인 · ${new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(lastSync)}`:'공용 장부 연결 확인 중'):data.updatedAt?`이 브라우저에 저장 · ${new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit'}).format(new Date(data.updatedAt))}`:'예시 시간표 · 학교의 실제 시간표가 아닙니다'}</p>
              </div>
            </section>
            <div className="mt-5 grid gap-3 md:grid-cols-2">
              <div className="flex items-start gap-3 rounded-xl border border-line bg-white p-4"><span className="mt-0.5 text-brand"><Plus size={18} aria-hidden="true"/></span><div><h2 className="text-xs font-semibold">예약은 빈 시간을 클릭해서</h2><p className="mt-1.5 text-xs leading-relaxed text-slate-500">‘예약 가능’ 시간을 선택하고 이름과 수업 목적을 입력하면 됩니다.</p></div></div>
              {canManage?<button type="button" onClick={()=>open('recurring')} disabled={!available||!room} className="group flex items-start gap-3 rounded-xl border border-line bg-white p-4 text-left hover:border-[#b5cfc3] disabled:opacity-50">
                <span className="mt-0.5 text-brand"><RefreshCw size={18} aria-hidden="true"/></span><span className="min-w-0 flex-1"><span className="block text-xs font-semibold">매주 같은 수업이라면, 고정 시간표로</span><span className="mt-1.5 block text-xs leading-relaxed text-slate-500">요일과 교시, 적용 기간을 선택해 한 번에 등록하세요.</span></span><ArrowRight size={15} className="mt-1 shrink-0 text-slate-400 group-hover:text-brand" aria-hidden="true"/>
              </button>:<div className="flex items-start gap-3 rounded-xl border border-line bg-white p-4"><Lock size={18} className="mt-0.5 shrink-0 text-brand" aria-hidden="true"/><div><h2 className="text-xs font-semibold">정규 수업은 고정 시간표로 관리해요</h2><p className="mt-1.5 text-xs leading-relaxed text-slate-500">매주 반복하는 수업은 특별실 담당 관리자에게 등록을 요청하세요.</p></div></div>}
            </div>
            <footer className="mt-7 flex flex-wrap justify-between gap-2 text-[11px] text-slate-500"><span>학교공간 · 함께 사용하는 수업 공간</span><span>{isHosted?'Google Sheets · Apps Script 공용 예약':'브라우저 저장 시제품 · 공용 데이터베이스 미연결'}</span></footer>
          </main>
        </div>
        {modal?.type==='booking'&&bookingRoom&&<BookingModal key={`${modal.roomId}-${modal.date}-${modal.period}`} slot={modal} room={bookingRoom} data={data} user={user} connected={isHosted} onSave={saveBooking} onDelete={deleteBooking} onClose={()=>setModal(null)}/>}
        {modal?.type==='booking'&&!bookingRoom&&<Modal title="특별실을 확인해 주세요" onClose={()=>setModal(null)}><div className="p-6"><p className="text-sm leading-7 text-slate-600">특별실 정보가 변경되었거나 연결을 확인해야 합니다. 창을 닫고 캘린더를 갱신해 주세요.</p><button type="button" onClick={()=>setModal(null)} className={`${primaryClass} mt-5`}>확인</button></div></Modal>}
        {modal?.type==='recurring'&&canManage&&<RecurringModal roomId={currentRoomId} data={data} onSave={saveRule} onDelete={deleteRule} onClose={()=>setModal(null)}/>}
        {modal?.type==='rooms'&&canManage&&<RoomManagerModal data={data} onCreate={input=>saveRoom(input,false)} onUpdate={input=>saveRoom(input,true)} onDelete={deleteRoom} onClose={()=>setModal(null)}/>}
        {modal?.type==='deployment'&&<DeploymentModal data={data} onClose={()=>setModal(null)}/>}
        <div aria-live="polite" aria-atomic="true" className="pointer-events-none fixed bottom-6 left-4 right-4 z-[60] flex justify-center">
          {toast&&<div className="animate-enter pointer-events-auto flex max-w-lg items-center gap-2.5 rounded-xl bg-[#233f34] px-5 py-3.5 text-sm text-white shadow-lg"><CheckCircle size={18} className="shrink-0" aria-hidden="true"/><span>{toast}</span><button type="button" onClick={()=>setToast('')} className="ml-2 rounded p-1 hover:bg-white/10" aria-label="알림 닫기"><X size={14} aria-hidden="true"/></button></div>}
        </div>
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
